<div class="card p-3 mb-4">

  <h5 class="mb-3">Filtrar productos</h5>

  <div class="row g-3">

    <div class="col-md-4">
      <input
        type="text"
        class="form-control"
        placeholder="Nombre"
        (input)="cambiarNombre($event)">
    </div>

    <div class="col-md-4">
      <input
        type="text"
        class="form-control"
        placeholder="Categoría"
        (input)="cambiarCategoria($event)">
    </div>

    <div class="col-md-4 d-flex align-items-center">
      <div class="form-check">
        <input
          class="form-check-input"
          type="checkbox"
          id="soloActivos"
          (change)="cambiarActivo($event)">
        <label class="form-check-label" for="soloActivos">
          Solo activos
        </label>
      </div>
    </div>

  </div>

</div>
