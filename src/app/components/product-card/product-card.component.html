<div class="card h-100 shadow-sm border-0">

  <div class="card-body">

    <h5 class="fw-semibold">{{ product.nombre }}</h5>

    <p class="text-muted small mb-2" *ngIf="product.descripcion">
      {{ product.descripcion }}
    </p>

    <p class="fw-bold text-primary">
      {{ product.precio }} €
    </p>

    <span class="badge bg-dark me-2">
      {{ product.categoria }}
    </span>

    <span
      class="badge"
      [class.bg-success]="product.activo"
      [class.bg-danger]="!product.activo">
      {{ product.activo ? 'Activo' : 'Inactivo' }}
    </span>

    <button
      class="btn btn-danger btn-sm w-100 mt-3"
      (click)="eliminar()">
      Eliminar producto
    </button>

  </div>

</div>
